name: Build Jetson base (ARM64)

# Jetson-сборка тяжёлая — только ручной запуск (позже можно добавить триггер по тегам).
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ilyasalih/ros2-cuda-jetson-agx

jobs:
  # --- Способ 1 (3.4): КРОСС-сборка ARM64 на x86-раннере через QEMU ---
  build-jetson-agx-qemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (эмуляция ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Jetson AGX base (cross via QEMU)
        uses: docker/build-push-action@v6
        with:
          context: docker/base/jetson-agx
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:humble-l4t-r36.4-qemu
          cache-from: type=gha,scope=jetson-qemu
          cache-to: type=gha,mode=max,scope=jetson-qemu

  # --- Способ 2 (3.4): НАТИВНАЯ сборка на ARM64-раннере GitHub (без эмуляции) ---
  build-jetson-agx-native:
    runs-on: ubuntu-24.04-arm     # нативный ARM64-раннер (бесплатен для публичных репо)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Jetson AGX base (native ARM64)
        uses: docker/build-push-action@v6
        with:
          context: docker/base/jetson-agx
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:humble-l4t-r36.4
            ${{ env.IMAGE }}:humble-l4t-r36.4-native
          cache-from: type=gha,scope=jetson-native
          cache-to: type=gha,mode=max,scope=jetson-native