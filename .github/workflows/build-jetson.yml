name: Build Jetson base (ARM64)

# Jetson-сборка тяжёлая (эмуляция ARM через QEMU) — только ручной запуск,
# чтобы не дёргать её на каждый push. Позже можно добавить триггер по тегам.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ilyasalih/ros2-cuda-jetson-agx:humble-l4t-r36.4

jobs:
  # Способ 1 (требование 3.4): кросс-сборка ARM64 на x86-раннере через QEMU.
  build-jetson-agx-qemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (эмуляция ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Jetson AGX base (linux/arm64 via QEMU)
        uses: docker/build-push-action@v6
        with:
          context: docker/base/jetson-agx
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max