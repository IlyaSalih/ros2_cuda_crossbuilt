name: Build FAST-LIO2 Orin Nano package (experimental, Jazzy)

# ЭКСПЕРИМЕНТАЛЬНО: FAST-LIO2 заточен под Humble, а Nano-база на Jazzy.
# Отдельный ручной workflow, чтобы не ронять основную матрицу. Если соберётся —
# вольём ячейку в build.yml; если нет — задокументируем как известное ограничение.
on:
  workflow_dispatch:

env:
  BASE_IMAGE: ghcr.io/ilyasalih/ros2-cuda-jetson-nano:jazzy-cuda13-ubuntu24.04
  PKG_IMAGE:  ghcr.io/ilyasalih/fast-lio2-jetson-nano:jazzy-cuda13

jobs:
  build-nano-package:
    runs-on: ubuntu-24.04-arm     # нативный ARM64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FAST-LIO2 (Orin Nano / Jazzy — EXPERIMENTAL)
        uses: docker/build-push-action@v6
        with:
          context: docker/package
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            CUDA_ARCHITECTURES=87
          tags: ${{ env.PKG_IMAGE }}
          cache-from: type=gha,scope=pkg-nano
          cache-to: type=gha,mode=max,scope=pkg-nano