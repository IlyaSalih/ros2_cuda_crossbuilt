name: Build & push (matrix)

# Триггеры (3.5): push в main/master, создание тега vX.Y.Z, ручной запуск.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ================= Базовые образы: платформы (нативная сборка) =================
  # Канонические базы, на которых строятся пакеты. Матрица по платформам.
  build-base:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86 (native)
            context: docker/base/x86
            arch: linux/amd64
            runner: ubuntu-latest
            tags: ghcr.io/ilyasalih/ros2-cuda-x86:humble-cuda12.6
            cache_scope: base-x86
          - name: jetson-agx (native ARM64)
            context: docker/base/jetson-agx
            arch: linux/arm64
            runner: ubuntu-24.04-arm
            tags: ghcr.io/ilyasalih/ros2-cuda-jetson-agx:humble-l4t-r36.4
            cache_scope: base-jetson-native
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push base — ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.arch }}
          push: true
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # ============ Второй способ сборки ARM64 (3.4): КРОСС через QEMU ============
  # Идёт независимо (пакеты от него НЕ зависят) — демонстрация метода + отказоустойчивость.
  build-base-cross-qemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (эмуляция ARM64)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Jetson AGX base (cross via QEMU)
        uses: docker/build-push-action@v6
        with:
          context: docker/base/jetson-agx
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ilyasalih/ros2-cuda-jetson-agx:humble-l4t-r36.4-qemu
          cache-from: type=gha,scope=base-jetson-qemu
          cache-to: type=gha,mode=max,scope=base-jetson-qemu

  # ================= Пакет FAST-LIO2 поверх баз (по платформам) =================
  # Один и тот же шаблон docker/package, разные аргументы (3.3). Нативные раннеры.
  build-package:
    needs: build-base
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            arch: linux/amd64
            runner: ubuntu-latest
            base: ghcr.io/ilyasalih/ros2-cuda-x86:humble-cuda12.6
            cuda_arch: "89"
            tags: ghcr.io/ilyasalih/fast-lio2-x86:humble-cuda12.6
            cache_scope: pkg-x86
          - name: jetson-agx
            arch: linux/arm64
            runner: ubuntu-24.04-arm
            base: ghcr.io/ilyasalih/ros2-cuda-jetson-agx:humble-l4t-r36.4
            cuda_arch: "87"
            tags: ghcr.io/ilyasalih/fast-lio2-jetson-agx:humble-l4t-r36.4
            cache_scope: pkg-jetson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push package — ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: docker/package
          platforms: ${{ matrix.arch }}
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}