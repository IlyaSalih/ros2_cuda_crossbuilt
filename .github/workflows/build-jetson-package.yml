name: Build FAST-LIO2 Jetson package (ARM64)

# Собирает ПАКЕТ (FAST-LIO2) поверх уже опубликованной Jetson-базы.
# Тот же docker/package/Dockerfile, что и для x86 — меняются только аргументы.
# Нативный ARM-раннер: colcon компилирует много C++, под QEMU это были бы часы.
on:
  workflow_dispatch:

env:
  BASE_IMAGE: ghcr.io/ilyasalih/ros2-cuda-jetson-agx:humble-l4t-r36.4
  PKG_IMAGE:  ghcr.io/ilyasalih/fast-lio2-jetson-agx:humble-l4t-r36.4

jobs:
  build-package-native:
    runs-on: ubuntu-24.04-arm     # нативный ARM64-раннер
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FAST-LIO2 (Jetson AGX, native ARM64)
        uses: docker/build-push-action@v6
        with:
          context: docker/package
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            CUDA_ARCHITECTURES=87
          tags: ${{ env.PKG_IMAGE }}
          cache-from: type=gha,scope=jetson-pkg
          cache-to: type=gha,mode=max,scope=jetson-pkg